# /etc/nginx/sites-available/mcp.impactu.colav.co  (link it into sites-enabled)
# TLS certificates from Let's Encrypt: certbot --nginx -d mcp.impactu.colav.co

# at most 5 requests per second per client IP, bursts of 20 (the "zone" line must be at http level:
# nginx includes sites-enabled inside http {}, so it can stay here)
limit_req_zone $binary_remote_addr zone=impactu_mcp:10m rate=5r/s;

upstream impactu_mcp {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.impactu.colav.co;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx >= 1.25.1; on older nginx remove this line and use "listen 443 ssl http2;"
    server_name mcp.impactu.colav.co;

    ssl_certificate     /etc/letsencrypt/live/mcp.impactu.colav.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.impactu.colav.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location / {
        limit_req zone=impactu_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://impactu_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MCP may stream answers (text/event-stream): no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
