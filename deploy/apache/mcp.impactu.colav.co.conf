# /etc/apache2/sites-available/mcp.impactu.colav.co.conf   (Colav's servers run Apache with certbot)
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite mcp.impactu.colav.co && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d mcp.impactu.colav.co   # copies this block to port 443 and redirects 80 to it
<VirtualHost *:80>
    ServerName mcp.impactu.colav.co

    # The server refuses Host headers that are not in MCP_PUBLIC_HOSTS (421), so pass the public one on.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    LimitRequestBody 1048576

    # Indicators can take 30 s; flushpackets keeps streamed (text/event-stream) answers unbuffered.
    ProxyPass        / http://127.0.0.1:8000/ timeout=300 flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/mcp.impactu.colav.co-error.log
    CustomLog ${APACHE_LOG_DIR}/mcp.impactu.colav.co-access.log combined
</VirtualHost>
