[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/colav-playground/impactu-mcp"

[project]
name = "impactu-mcp"
version = "0.1.0"
description = "MCP server (Claude connector) for ImpactU, Colombia's open research information system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
impactu-mcp = "impactu_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/impactu_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
markers = ["live: calls the real ImpactU API (deselect with -m 'not live')"]
